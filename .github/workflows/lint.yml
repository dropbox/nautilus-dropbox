name: Run the linter
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y just
      - name: Lint
        run: just lint
