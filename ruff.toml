# We don't technically support Debian oldoldstable, but it's a good metric for
# the absolute lowest reasonable Python version in the wild, so keep this in
# sync with that.
target-version="py39"

# `dropbox.in` is technically a Python file, it's just a template.
include = ["*.py", "dropbox.in"]

exclude = [
    # Vendored code
    "rst2man.py",
]

line-length = 80
indent-width = 4

[lint]
# F401 - remove unused imports
# I - remove dead imports
select = ["F401", "I"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.isort]
case-sensitive = false
combine-as-imports = true
lines-between-types = 1
order-by-type = false

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
